# Crimson Horizons: checked every day, or by hand (Actions > EPUB · Crimson Horizons > Run workflow)
name: "EPUB · Crimson Horizons"

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if nothing changed on AO3"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: epub-ch
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/epub-build.yml
    with:
      story: "Crimson Horizons"
      file: "Crimson_Horizons"
      force: ${{ inputs.force == true }}
