# Checks AO3 for story updates, formats the EPUBs (epubs/ao3_epub.py)
# and uploads them to the "epubs" release, which gives each story a permanent link:
#   https://github.com/<owner>/<repo>/releases/download/epubs/<file>.epub
#
# Stories marked "check": "daily" in epubs/stories.json are checked every day.
# Everything else is only checked when you run this workflow by hand
# (Actions > Build formatted EPUBs > Run workflow).
name: Build formatted EPUBs

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      story:
        description: "Which story to check"
        type: choice
        default: "All stories"
        options:
          - "All stories"
          - "Crimson Horizons"
          - "From the Ring, With Love"
          - "Indra: Extra"
          - "Indra"
      force:
        description: "Rebuild even if nothing changed on AO3"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: epubs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: epubs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the release on first run
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Formatted EPUBs" \
            --notes "Always-current formatted EPUBs, rebuilt automatically when a story updates on AO3."

      - name: Fetch last known AO3 versions
        run: gh release download "$TAG" --pattern state.json --dir epubs --clobber || echo "No state yet, building everything"

      - name: Check AO3 and build
        working-directory: epubs
        env:
          STORY: ${{ inputs.story }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--ci)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            args+=(--only daily)
          elif [ -n "$STORY" ] && [ "$STORY" != "All stories" ]; then
            args+=(--story "$STORY")
          fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python3 ao3_epub.py "${args[@]}"

      - name: Upload new EPUBs
        if: always()
        run: |
          shopt -s nullglob
          files=(epubs/output/*.epub)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nothing new to upload"
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" epubs/state.json --clobber
