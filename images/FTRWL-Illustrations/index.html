<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From the Ring, With Love - Illustrations</title>
  <link rel="icon" type="image/x-icon" href="https://stroke-6.github.io/AO3/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700&display=swap" rel="stylesheet">

<body class="ftrwl" data-folder="FTRWL-Illustrations">
  <main>
    <a class="back" href="https://stroke-6.github.io/AO3/">&larr; stroke6</a>

    <header>
      <h1><span class="highlight">Illustrations</span></h1>
    </header>

    <div class="section-label">
      <h2>From the Ring, With Love</h2>
      <div class="line"></div>
      <span class="count" id="count"></span>
    </div>

    <div class="controls">
      <input id="filter" type="search" placeholder="Filter by file name..." aria-label="Filter by file name">
    </div>

    <div id="grid"></div>

    <footer>Click an image to view it full size &middot; arrow keys to browse &middot; Esc to close</footer>
  </main>

  <div id="lightbox" role="dialog" aria-label="Image viewer">
    <button class="close" aria-label="Close">&times;</button>
    <button class="prev" aria-label="Previous">&lsaquo;</button>
    <img alt="">
    <div class="caption"></div>
    <button class="next" aria-label="Next">&rsaquo;</button>
  </div>

  <script src="../../js/gallery.js"></script>
