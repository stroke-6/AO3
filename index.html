<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stroke6 — Resources</title>
  <link rel="icon" type="image/x-icon" href="https://stroke-6.github.io/AO3/images/favicon.ico">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,700;1,400&display=swap" rel="stylesheet">

  <!-- React Dependencies (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      /* Palette */
      --color-bg: #f8f9fa;
      --color-surface: #ffffff;
      --color-text-primary: #1f2937;
      --color-text-secondary: #4b5563;
      --color-border: #e5e7eb;
      
      /* Accents */
      --accent-red: #b91c1c;
      --accent-red-bg: #fef2f2;
      --accent-blue: #2563eb;
      --accent-blue-bg: #eff6ff;
      --accent-gold: #d97706;
      --accent-gold-bg: #fffbeb;

      /* Spacing & Radius */
      --radius-lg: 16px;
      --radius-md: 8px;
      --radius-sm: 4px;
      
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-float: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #111827;
        --color-surface: #1f2937;
        --color-text-primary: #f3f4f6;
        --color-text-secondary: #9ca3af;
        --color-border: #374151;
        
        --accent-red: #f87171;
        --accent-red-bg: #450a0a;
        --accent-blue: #60a5fa;
        --accent-blue-bg: #172554;
        --accent-gold: #fbbf24;
        --accent-gold-bg: #422006;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 {
      font-family: "Merriweather", serif;
      margin: 0;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Animation Utilities */
    .fade-in {
      animation: fadeIn 0.5s ease-out forwards;
      opacity: 0;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Plain JSX (no TypeScript) -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;
    const { createRoot } = ReactDOM;

    // --- Components ---

    const HoverTrigger = ({ children, imageSrc, onHover }) => {
      const handleMouseEnter = (e) => {
        onHover(imageSrc, e.clientX, e.clientY);
      };

      const handleMouseMove = (e) => {
        onHover(imageSrc, e.clientX, e.clientY);
      };

      const handleMouseLeave = () => {
        onHover(null, 0, 0);
      };

      return (
        <span 
          onMouseEnter={handleMouseEnter}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={{
            cursor: "help",
            borderBottom: "2px dotted currentColor",
            fontWeight: 500
          }}
        >
          {children}
        </span>
      );
    };

    const Card = ({ item }) => {
      const accentStyles = {
        red: { border: "var(--accent-red)", bg: "var(--accent-red-bg)", text: "var(--accent-red)" },
        blue: { border: "var(--accent-blue)", bg: "var(--accent-blue-bg)", text: "var(--accent-blue)" },
        gold: { border: "var(--accent-gold)", bg: "var(--accent-gold-bg)", text: "var(--accent-gold)" },
      };

      const style = accentStyles[item.accent];

      return (
        <a 
          href={item.url}
          target="_blank"
          rel="noopener noreferrer"
          className="card fade-in"
          style={{
            display: "block",
            textDecoration: "none",
            backgroundColor: "var(--color-surface)",
            borderRadius: "var(--radius-md)",
            border: "1px solid var(--color-border)",
            borderLeft: `6px solid ${style.border}`,
            padding: "1.25rem",
            marginBottom: "1rem",
            transition: "transform 0.2s, box-shadow 0.2s, background-color 0.2s",
            boxShadow: "var(--shadow-sm)"
          }}
          onMouseEnter={(e) => {
            e.currentTarget.style.transform = "translateY(-2px)";
            e.currentTarget.style.boxShadow = "var(--shadow-md)";
            e.currentTarget.style.backgroundColor = style.bg;
          }}
          onMouseLeave={(e) => {
            e.currentTarget.style.transform = "translateY(0)";
            e.currentTarget.style.boxShadow = "var(--shadow-sm)";
            e.currentTarget.style.backgroundColor = "var(--color-surface)";
          }}
        >
          <div style={{ display: "flex", alignItems: "baseline", gap: "0.5rem", marginBottom: "0.5rem" }}>
            <h3 style={{ 
              fontSize: "1.125rem", 
              fontWeight: 600, 
              color: style.text
            }}>
              {item.title}
            </h3>
          </div>
          <div style={{ 
            color: "var(--color-text-secondary)", 
            fontSize: "0.95rem",
            lineHeight: "1.5"
          }}>
            {item.description}
          </div>
        </a>
      );
    };

    const ImagePreviewTooltip = ({ src, x, y }) => {
      if (!src) return null;

      const style = {
        position: "fixed",
        top: y + 20,
        left: x + 20,
        maxWidth: "300px",
        maxHeight: "300px",
        borderRadius: "var(--radius-md)",
        boxShadow: "var(--shadow-float)",
        backgroundColor: "var(--color-surface)",
        padding: "8px",
        zIndex: 1000,
        pointerEvents: "none",
        opacity: 1,
        animation: "fadeIn 0.2s ease-out"
      };

      return (
        <div style={style}>
          <img src={src} alt="Preview" style={{ width: "100%", borderRadius: "4px", display: "block" }} />
        </div>
      );
    };

    const App = () => {
      const [tooltip, setTooltip] = useState({ src: null, x: 0, y: 0 });

      const handleHover = (src, x, y) => {
        setTooltip({ src, x, y });
      };

      // Preload images
      useEffect(() => {
        const images = ["https://d.l3n.co/i/N8Vc1v.png", "https://a.l3n.co/i/N8Q65x.png"];
        images.forEach(src => {
          const img = new Image();
          img.src = src;
        });
      }, []);

      const sections = [
        {
          title: "Tools",
          items: [
            {
              title: "Character Card Generator",
              url: "https://stroke-6.github.io/AO3/Character%20Card%20Generator.html",
              description: <>Generates HTML code for character profiles used in <em>From the Ring, With Love</em>.</>,
              accent: "red"
            },
            {
              title: "Character Radar Chart",
              url: "https://stroke-6.github.io/AO3/Character%20Radar%20Chart.html",
              description: <>Creates radar charts for visualising character statistics in <em>Crimson Horizons</em>.</>,
              accent: "red"
            }
          ]
        },
        {
          title: "Userscripts",
          items: [
            {
              title: "AO3 Direct Chapter Index Button",
              url: "https://stroke-6.github.io/AO3/AO3%20Direct%20Chapter%20Index%20Button.user.js",
              description: <>Adds a <HoverTrigger imageSrc="https://d.l3n.co/i/N8Vc1v.png" onHover={handleHover}>convenient button</HoverTrigger> to story &amp; author pages for instant access to the chapter index.</>,
              accent: "blue"
            },
            {
              title: "AO3 Story Downloader",
              url: "https://stroke-6.github.io/AO3/AO3%20Story%20Downloader.user.js",
              description: <>Download huge works (e.g. <em>Crimson Horizons</em>) as well-formatted EPUBs even once AO3's built-in button taps out. Without author's notes, and my own formatting style.</>,
              accent: "blue"
            },
            {
              title: "FanFiction.net Enhanced Reader",
              url: "https://stroke-6.github.io/AO3/FanFiction.net%20Enhanced%20Reader.user.js",
              description: <>Transforms image codes like <code style={{ background: "rgba(128,128,128,0.1)", padding: "2px 4px", borderRadius: "4px", fontSize: "0.9em" }}>i/D7UmSr</code> into <HoverTrigger imageSrc="https://a.l3n.co/i/N8Q65x.png" onHover={handleHover}>clickable buttons</HoverTrigger>, automatically styles chapter titles in serif typography, and enables text selection.</>,
              accent: "blue"
            }
          ]
        },
        {
          title: "Story Annexes",
          items: [
            {
              title: "From the Ring, With Love — Family Tree",
              url: "https://stroke-6.github.io/AO3/FTRWL%20Family%20Tree.html",
              description: "A visual map of character connections within the FTRWL universe.",
              accent: "gold"
            },
            {
              title: "From the Ring, With Love — Character Cards",
              url: "https://stroke-6.github.io/AO3/All%20Character%20Cards.html",
              description: "Character stats and information within the FTRWL universe.",
              accent: "gold"
            }
          ]
        }
      ];

      return (
        <main style={{ 
          width: "100%", 
          maxWidth: "800px", 
          margin: "0 auto", 
          padding: "2rem 1rem",
        }}>
          {/* Header */}
          <header style={{ 
            display: "flex", 
            alignItems: "center", 
            gap: "1.5rem", 
            marginBottom: "3rem",
            paddingBottom: "2rem",
            borderBottom: "1px solid var(--color-border)"
          }} className="fade-in">
            <div style={{
              width: "80px",
              height: "80px",
              borderRadius: "var(--radius-md)",
              overflow: "hidden",
              backgroundColor: "#ddd",
              flexShrink: 0,
              boxShadow: "var(--shadow-md)"
            }}>
              <img 
                src="https://stroke-6.github.io/AO3/images/original.jpg" 
                alt="Stroke" 
                style={{ width: "100%", height: "100%", objectFit: "cover" }}
                onError={(e) => {
                  e.currentTarget.style.display = "none";
                  if (e.currentTarget.parentElement) {
                    e.currentTarget.parentElement.style.background = "linear-gradient(135deg, var(--accent-red), #4a0404)";
                    e.currentTarget.parentElement.innerHTML = "<div style='display:flex;width:100%;height:100%;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:2rem'>S</div>";
                  }
                }} 
              />
            </div>
            <div>
              <h1 style={{ 
                fontSize: "2.5rem", 
                fontWeight: 800, 
                color: "var(--accent-red)",
                marginBottom: "0.5rem",
                letterSpacing: "-0.02em"
              }}>Resources</h1>
              <p style={{ 
                fontSize: "1.1rem", 
                color: "var(--color-text-secondary)",
                margin: 0,
                maxWidth: "600px"
              }}>
                Hi, stroke here. Here's some stuff that is mostly useful to myself.
              </p>
            </div>
          </header>

          {/* Sections */}
          {sections.map((section, idx) => (
            <section 
              key={section.title} 
              style={{ marginBottom: "3rem", animationDelay: `${idx * 0.1}s` }} 
              className="fade-in"
            >
              <div style={{ display: "flex", alignItems: "center", gap: "0.75rem", marginBottom: "1.5rem" }}>
                <h2 style={{ 
                  fontSize: "1.5rem", 
                  color: "var(--color-text-primary)",
                  fontWeight: 700
                }}>
                  {section.title}
                </h2>
                <div style={{ flex: 1, height: "1px", backgroundColor: "var(--color-border)" }}></div>
              </div>
              
              <div style={{ display: "grid", gap: "0.5rem" }}>
                {section.items.map((item) => (
                  <Card key={item.title} item={item} />
                ))}
              </div>
            </section>
          ))}

          
          {/* Tooltip Portal */}
          <ImagePreviewTooltip src={tooltip.src} x={tooltip.x} y={tooltip.y} />
        </main>
      );
    };

    const container = document.getElementById("root");
    const root = createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
